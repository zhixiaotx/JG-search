<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ChatGPT 极速智能搜索与 AI 问答">
    <title>ChatGPT Search - 极光快搜</title>
    <style>
        :root {
            --primary-color: #10a37f;
            --primary-hover: #1a7f64;
            --background-color: #212121;
            --chat-container-bg: #2f2f2f;
            --text-color: #ececec;
            --text-muted: #9ca3af;
            --placeholder-color: #8e8ea0;
            --border-color: rgba(255, 255, 255, 0.12);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            text-align: center;
            background-color: var(--background-color);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 16px 30px;
        }
        .logo-container {
            margin-bottom: 24px;
        }
        .logo {
            width: 64px;
            height: 64px;
            display: inline-block;
            transition: transform 0.2s;
        }
        .logo:hover {
            transform: scale(1.05);
        }
        .title {
            margin-top: 12px;
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .subtitle {
            margin-top: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .chat-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }
        .chat-form {
            width: 100%;
            position: relative;
        }
        .chat-input-wrapper {
            position: relative;
            background-color: var(--chat-container-bg);
            border-radius: 18px;
            border: 1px solid var(--border-color);
            padding: 14px 18px 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: left;
        }
        .chat-input-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 4px 28px rgba(16, 163, 127, 0.2);
        }
        .chat-input {
            width: 100%;
            min-height: 68px;
            max-height: 240px;
            padding-right: 48px;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            line-height: 1.5;
            background: transparent;
            color: var(--text-color);
            font-family: inherit;
        }
        .chat-input::placeholder {
            color: var(--placeholder-color);
        }
        .submit-button {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #3f3f46;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .submit-button.active, .submit-button:hover {
            background-color: #ffffff;
        }
        .submit-button svg {
            width: 18px;
            height: 18px;
            stroke: #a1a1aa;
            transition: stroke 0.2s ease;
        }
        .submit-button.active svg, .submit-button:hover svg {
            stroke: #18181b;
        }
        
        /* Action buttons row */
        .actions-row {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            text-decoration: none;
        }
        .btn-chatgpt {
            background-color: var(--primary-color);
            color: #ffffff;
        }
        .btn-chatgpt:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-ai {
            background-color: #7c3aed;
            color: #ffffff;
        }
        .btn-ai:hover {
            background-color: #6d28d9;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.12);
            color: #d1d5db;
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Result container for in-page AI response */
        .ai-result-box {
            display: none;
            margin-top: 22px;
            width: 100%;
            background: #27272a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .ai-result-box.show {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ai-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-b: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #c4b5fd;
        }
        .ai-content {
            font-size: 15px;
            line-height: 1.7;
            color: #e4e4e7;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .ai-sources {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .source-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #a1a1aa;
            font-size: 12px;
            text-decoration: none;
            transition: all 0.15s;
        }
        .source-pill:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        /* Quick Tags */
        .tag-row {
            margin-top: 18px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tag {
            padding: 6px 14px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
            color: #b4b4b4;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tag:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .disclaimer {
            margin-top: 28px;
            text-align: center;
            color: var(--placeholder-color);
            font-size: 12px;
            line-height: 1.6;
        }
        .disclaimer a {
            color: #10a37f;
            text-decoration: none;
        }
        .disclaimer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <!-- Self-contained OpenAI / ChatGPT SVG logo -->
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#10a37f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 1 10 10c0 4.14-2.52 7.7-6.14 9.17l-.86-2.07A7.75 7.75 0 0 0 19.75 12a7.75 7.75 0 0 0-7.75-7.75A7.75 7.75 0 0 0 4.25 12c0 2.87 1.55 5.37 3.86 6.72l-.99 2.02A10 10 0 0 1 2 12 10 10 0 0 1 12 2z"/>
            <path d="M12 6a6 6 0 0 1 6 6c0 2.22-1.2 4.16-2.98 5.19l-.92-1.78A4 4 0 0 0 16 12a4 4 0 0 0-4-4 4 4 0 0 0-4 4c0 1.25.57 2.37 1.48 3.1l-.98 1.74A6 6 0 0 1 6 12a6 6 0 0 1 6-6z"/>
            <circle cx="12" cy="12" r="2" fill="#10a37f"/>
        </svg>
        <div class="title">ChatGPT 智能检索</div>
        <div class="subtitle">支持官网直达检索与内置极光 AI 在线解答双通道</div>
    </div>

    <div class="chat-container">
        <!-- Standard HTML form ensuring 100% reliable navigation without popup blocker interference -->
        <form class="chat-form" id="chatForm" action="https://chatgpt.com/" method="GET" target="_blank" onsubmit="handleFormSubmit(event)">
            <input type="hidden" name="hints" value="search" />
            <div class="chat-input-wrapper">
                <textarea
                    name="q"
                    id="chatInput"
                    class="chat-input"
                    placeholder="输入任何问题进行 ChatGPT 智能检索...（Shift+Enter 换行，Enter 直接搜索）"
                    autofocus
                ></textarea>
                <button type="submit" class="submit-button" id="submitBtn" title="点击发送">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>

            <div class="actions-row">
                <button type="submit" class="btn btn-chatgpt">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                    <span>ChatGPT 官网搜索</span>
                </button>

                <button type="button" class="btn btn-ai" onclick="askInstantAI()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
                    </svg>
                    <span id="aiBtnText">极光 AI 本页即答</span>
                </button>

                <button type="button" class="btn btn-secondary" onclick="openDeepSeek()">
                    <span>DeepSeek 深度求索</span>
                </button>

                <button type="button" class="btn btn-secondary" onclick="openKimi()">
                    <span>Kimi 搜索</span>
                </button>
            </div>
        </form>

        <!-- Inline AI Answer Container -->
        <div class="ai-result-box" id="aiResultBox">
            <div class="ai-header">
                <span>🤖 极光 AI 智能解析解答</span>
                <button type="button" onclick="closeAiResult()" style="background:none; border:none; color:#a1a1aa; cursor:pointer; font-size:16px;">✕</button>
            </div>
            <div class="ai-content" id="aiContent">正在思考解答中，请稍候...</div>
            <div class="ai-sources" id="aiSources"></div>
        </div>

        <div class="tag-row">
            <span class="tag" onclick="quickSearch('写一段代码')">💻 代码编写</span>
            <span class="tag" onclick="quickSearch('总结最新科技前沿趋势')">🔬 科技趋势</span>
            <span class="tag" onclick="quickSearch('用通俗语言解释量子纠缠')">💡 概念科普</span>
            <span class="tag" onclick="quickSearch('制定一份高效学习计划')">📋 计划规划</span>
        </div>
    </div>

    <div class="disclaimer">
        极光快搜 · 纯净通道 ｜ 若 ChatGPT 官网因网络环境无法直连，可使用【极光 AI 本页即答】或 DeepSeek 获得即时分析。
    </div>

    <script>
        const chatInput = document.getElementById('chatInput');
        const submitButton = document.getElementById('submitBtn');
        const chatForm = document.getElementById('chatForm');
        const aiResultBox = document.getElementById('aiResultBox');
        const aiContent = document.getElementById('aiContent');
        const aiSources = document.getElementById('aiSources');
        const aiBtnText = document.getElementById('aiBtnText');

        // URL 参数回填
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                chatInput.value = q;
                submitButton.classList.add('active');
                adjustTextareaHeight();
            }
            chatInput.focus();
        });

        function adjustTextareaHeight() {
            chatInput.style.height = 'auto';
            const newHeight = Math.min(chatInput.scrollHeight, 240);
            chatInput.style.height = Math.max(newHeight, 68) + 'px';
        }

        chatInput.addEventListener('input', function() {
            adjustTextareaHeight();
            if (this.value.trim()) {
                submitButton.classList.add('active');
            } else {
                submitButton.classList.remove('active');
            }
        });

        // 快捷键 Enter 发送，Shift+Enter 换行
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.requestSubmit();
            }
        });

        function handleFormSubmit(e) {
            const q = chatInput.value.trim();
            if (!q) {
                e.preventDefault();
                chatInput.focus();
                return;
            }
            // Form targets _blank and submits natively to https://chatgpt.com/?hints=search&q=...
        }

        function quickSearch(text) {
            chatInput.value = text;
            submitButton.classList.add('active');
            adjustTextareaHeight();
            askInstantAI();
        }

        function openDeepSeek() {
            const q = chatInput.value.trim();
            const url = q ? `https://chat.deepseek.com/` : `https://chat.deepseek.com/`;
            window.open(url, '_blank');
        }

        function openKimi() {
            const q = chatInput.value.trim();
            const url = q ? `https://kimi.moonshot.cn/?q=${encodeURIComponent(q)}` : `https://kimi.moonshot.cn/`;
            window.open(url, '_blank');
        }

        async function askInstantAI() {
            const q = chatInput.value.trim();
            if (!q) {
                chatInput.focus();
                return;
            }

            aiResultBox.classList.add('show');
            aiContent.textContent = '⏳ 正在向极光 AI 检索系统请求深度解答，请稍候...';
            aiSources.innerHTML = '';
            aiBtnText.textContent = '正在解析...';

            try {
                const response = await fetch('/api/ai-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: q })
                });

                if (!response.ok) {
                    throw new Error('AI 服务异常');
                }

                const data = await response.json();
                aiContent.textContent = data.answer || '未能获取到有效答案。';

                if (Array.isArray(data.sources) && data.sources.length > 0) {
                    aiSources.innerHTML = '';
                    data.sources.forEach(s => {
                        const a = document.createElement('a');
                        a.className = 'source-pill';
                        a.href = s.url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.innerHTML = `<span>🔗</span><span>${s.title}</span>`;
                        aiSources.appendChild(a);
                    });
                }
            } catch (err) {
                aiContent.textContent = `⚠️ 查询异常或网络超时。您也可以直接点击上方【ChatGPT 官网搜索】或【DeepSeek】在新标签页中继续探索。`;
            } finally {
                aiBtnText.textContent = '极光 AI 本页即答';
            }
        }

        function closeAiResult() {
            aiResultBox.classList.remove('show');
        }
    </script>
</body>
</html>
